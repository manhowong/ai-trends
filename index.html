<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI / ML Trend Explorer</title>
    <base target="_blank"> <!-- Open all links in new tab -->
    <link rel="icon" type="image/png" href="./dashboard/img/icon.png">
    <link rel="stylesheet" href="./dashboard/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.38/dist/katex.min.css">
</head>

<body>
    <div id="main-container">

        <div id="site-banner">

            <h1>AI<span id="slash-mark"></span>ML 
                Trend<br />
                Explorer
            </h1>

            <div id="site-info">
                <span id="dateText"></span>
                arXiv articles
                <help-icon role="button" data-help="documentation"></help-icon>
            </div>

            <div id="banner-menu">

                <div id="legend-btn" type="button" aria-label="Open legend">
                    <span class="info-icon"></span> Legend
                </div>

                <v-bar></v-bar>

                <div id="report-btn">
                    <a href="https://github.com/manhowong/ai-trends/issues/new" target="_blank">
                        <span class="github-icon"></span> Suggest
                    </a>
                </div>

                <v-bar></v-bar>
                
                <div id="themeToggle" aria-pressed="true" title="Toggle light/dark theme">
                    <span>Dark</span>
                    <span class="ui-switch" aria-hidden="true">
                        <span class="ui-switch-thumb"></span>
                    </span>
                </div>

            </div>

            <div id="searchBtn">
                Find Topics...<span class="icon search-icon"></span>
            </div>

        </div>

        <div id="chart-wrapper">
            <div id="chart"></div>
            <div id="mobile-hint" aria-live="polite">
                <div><b>Tap again</b> to go down a level.</div>
                <div><b>Long-press</b> anywhere to go back.</div>
            </div>
        </div>
        <div id="sidebar">

            <button id="sidebarToggle" title="Collapse sidebar">
                <div class="initial-label">
                    <span class="down-icon">Hide</span> 
                </div>
                <div class="transformed-label">
                    <span class="hamburger-icon">Control</span> 
                </div>
            </button>

            <div id="sidebarContent">

                <div id="data-control-box">

                    <div id="dateRangeControl">
                        <div class="date-range-header">Date Range</div>
                        <div class="date-range-row">
                            <select id="startMonthSelect" class="date-range-select form-select"></select>
                            <span class="date-range-sep">to</span>
                            <select id="endMonthSelect" class="date-range-select form-select"></select>
                        </div>
                    </div>

                    <div id="control-disabled-message">
                        Viewing <b>Research Areas</b>. More filters at <b>Topic</b> level.
                    </div>

                    <div id="volumeThresholdControl">
                        <div class="paper-threshold-header">
                            <span class="paper-threshold-label">Articles Per Topic</span>
                            <div class="paper-threshold-right">
                                <span id="volumeThresholdVal"></span>
                            </div>
                        </div>
                        <input type="range" id="volumeThresholdSlider">
                    </div>

                    <div id="edgeThresholdControl">
                        <div class="paper-threshold-header">
                            <span class="paper-threshold-label">Link Strength (DSC)</span>
                            <div class="paper-threshold-right">
                                <span id="edgeThresholdVal"></span>
                            </div>
                        </div>
                        <input type="range" id="edgeThresholdSlider">
                    </div>

                    <div id="edgeToggleControl">
                        <label class="edge-toggle-row">
                            <span>Cross-Area Links</span>
                            <input type="checkbox" id="toggleCrossEdges" checked>
                            <span class="ui-switch"><span class="ui-switch-thumb"></span></span>
                        </label>
                        <label class="edge-toggle-row">
                            <span>Intra-Area Links</span>
                            <input type="checkbox" id="toggleIntraEdges" checked>
                            <span class="ui-switch"><span class="ui-switch-thumb"></span></span>
                        </label>
                    </div>

                </div>

                <div id="display-control-box">

                    <div id="fontSizeControl">
                        <div class="font-size-header">
                            <span class="font-size-label">Font Size</span>
                            <div class="font-size-right">
                                <span id="fontSizeVal">12px</span>
                                <span id="fontSizeReset" title="Reset to default">
                                    <span class="icon anticlock-nospace-icon"></span>
                                </span>
                            </div>
                        </div>
                        <input type="range" id="fontSlider" min="6" max="20" value="12">
                    </div>

                    <button id="fitBtn" class="form-btn">
                        <span class="icon screen-icon">Fit to canvas</span>
                    </button>

                </div>                
            </div>
        </div>

        <div id="info-panel">

            <button id="panelToggle" title="Collapse panel">
                <div class="initial-label">
                    <span class="down-icon">Hide</span> 
                </div>
                <div class="transformed-label">
                    <span class="up-icon">Open</span> 
                </div>
            </button>

            <div id="panelContent">
                <div id="panel-breadcrumb">
                    <div id="treeItems"></div>
                </div>

                <div class="info-box" id="info-top">
                    <div class="info-box-header">
                        <span class="info-box-title" id="info-top-title"></span>
                        <div id="info-top-sort"></div>
                    </div>
                    <div class="info-box-content" id="info-top-content"></div>
                </div>

                <div class="info-box" id="info-bottom">
                    <div class="info-box-header">
                        <span class="info-box-title" id="info-bottom-title"></span>
                        <div id="info-bottom-sort"></div>
                    </div>
                    <div class="info-box-content" id="info-bottom-content"></div>
                </div>

                <div id="panel-footer">
                    <span class="info-box-title">Source</span>
                    <a href="https://github.com/manhowong/" target="_blank">Man Ho Wong</a> <v-bar></v-bar>
                    <a href="https://github.com/manhowong/ai-trends/blob/main/license-summary.md"
                        target="_blank">GNU GPL</a> <v-bar></v-bar>
                    <a href="https://github.com/manhowong/ai-trends" target="_blank">data + code</a>
                </div>
            </div><!-- /panelContent -->
        </div><!-- /info-panel -->

    </div><!-- /main-container -->

    <div id="search-overlay" class="overlay-modal">
        <div id="search-backdrop" class="overlay-backdrop"></div>
        <div id="search-modal" class="overlay-dialog">
            <div id="search-bar">
                <input
                id="search-input"
                type="text"
                placeholder="Find topics and areas..."
                autocomplete="off"
                spellcheck="false"
                />
                <button id="randomTopicBtn" type="button" aria-label="Open a random topic" title="Random topic">
                    <span>Random</span>
                    <span class="dice-icon" aria-hidden="true"></span>
                </button>
            </div>
            <div id="search-results"></div>
        </div>
    </div>

    <div id="help-overlay" class="overlay-modal">
        <div id="help-backdrop" class="overlay-backdrop"></div>
        <div id="help-modal" class="overlay-dialog">
            <div id="help-header">
                <div id="help-title"></div>
                <button id="help-close" type="button" aria-label="Close help">Close</button>
            </div>
            <div id="help-content"></div>
            <button id="help-top" type="button" aria-label="Back to top">
                &#8593;
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script type="module" src="./dashboard/scripts/main.js"></script>
</body>

</html>
